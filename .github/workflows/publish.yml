name: Build and publish Docker image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: publish-doh-server
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/DNSCrypt/doh-server/releases/latest)"

          version="$(jq -r '.tag_name' <<<"${release}")"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Unexpected release tag: ${version}" >&2
            exit 1
          }

          jq -e --arg version "${version}" '
            [.assets[].name] as $assets
            | ($assets | index("doh-proxy_\($version)_linux-x86_64.tar.bz2")) != null
              and
              ($assets | index("doh-proxy_\($version)_linux-aarch64.tar.bz2")) != null
          ' <<<"${release}" >/dev/null || {
            echo "Release ${version} is missing amd64 or arm64 Linux binary" >&2
            exit 1
          }

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this image version is already published
        id: image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/doh-server-docker
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "${IMAGE}:${VERSION} already exists; skipping."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check out repository
        if: steps.image.outputs.exists != 'true'
        uses: actions/checkout@v4

      - name: Build and push multi-platform image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/doh-server-docker:${{ steps.release.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/doh-server-docker:latest